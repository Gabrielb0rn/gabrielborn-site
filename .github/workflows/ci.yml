name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores de mentira: o CI não fala com banco nem com o Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-de-teste
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Testes de unidade
        run: npm test
      - name: Build
        run: npm run build
      - name: Testes de ponta a ponta
        run: npm run test:e2e
